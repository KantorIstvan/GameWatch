spring:
  application:
    name: gamewatch-backend
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gamewatch}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Connection pool settings optimized for high concurrency
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Batch processing for better performance
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        # Enable second-level cache
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
    open-in-view: false
  
  # Avatar uploads are downscaled in the browser before they are sent, so a real one lands
  # far under this. The cap is a backstop against a direct API call, and matches the one
  # UserAvatarService enforces on the bytes it stores.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-bhq8kp3tfqiph7j8.us.auth0.com/}
          audience: ${AUTH0_AUDIENCE:https://api.gamewatch.com}

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.gamewatch: DEBUG
    org.springframework.security: DEBUG

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

igdb:
  client-id: ${TWITCH_CLIENT_ID:}
  client-secret: ${TWITCH_CLIENT_SECRET:}
  base-url: https://api.igdb.com/v4
  auth-url: https://id.twitch.tv/oauth2/token

# Only used by the admin module's Auth0ManagementApiService/Auth0AuthenticationApiService
# (block/unblock, delete, password-reset-email). Separate from the oauth2.resourceserver
# block above, which is what validates every incoming request's JWT and needs no
# credentials of its own.
auth0:
  domain: ${AUTH0_DOMAIN:dev-bhq8kp3tfqiph7j8.us.auth0.com}
  client-id: ${AUTH0_CLIENT_ID:}
  db-connection: ${AUTH0_DB_CONNECTION:Username-Password-Authentication}
  management:
    client-id: ${AUTH0_MGMT_CLIENT_ID:}
    client-secret: ${AUTH0_MGMT_CLIENT_SECRET:}

rate-limit:
  requests-per-minute: ${RATE_LIMIT_RPM:120}
