spring:
  jpa:
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audience: ${AUTH0_AUDIENCE}

logging:
  level:
    com.gamewatch: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

igdb:
  client-id: ${TWITCH_CLIENT_ID:}
  client-secret: ${TWITCH_CLIENT_SECRET:}
